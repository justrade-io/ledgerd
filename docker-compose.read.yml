# Standby read nodes for the ADBE cluster. Each node runs as a standalone
# process: it connects to a cluster member's Aeron Archive, periodically
# downloads the latest service snapshot, loads it into the balance engine,
# and serves eventually-consistent reads over HTTP.
#
# Standby nodes do NOT appear in clusterMembers, do not vote in Raft
# elections, and do not affect quorum. They can be added, removed, or
# restarted independently without impacting write availability.
#
# Prerequisites: the write cluster (docker-compose.yml) must be running.
#
#   docker compose up                    # start the 3-node write cluster
#   docker compose -f docker-compose.read.yml up --build  # start standby read nodes
#
# Write to the cluster via an AdbeClient against any member ingress.
# Read with:
#   curl http://localhost:8080/balance/100
#   curl http://localhost:8080/supply
#
# Snapshot staleness is bounded by ADBE_SNAPSHOT_POLL_MS (default 5000 ms).

name: adbe-read

x-read-common: &read_common
  build:
    context: .
    dockerfile: Dockerfile
    target: read
  image: adbe-read:local
  networks:
    - adbe-write
  shm_size: "512m"
  restart: unless-stopped

services:
  adbe-read-0:
    <<: *read_common
    hostname: adbe-read-0
    environment:
      ADBE_MODE: "standby"
      ADBE_ARCHIVE_CHANNEL: "aeron:udp?endpoint=adbe-node-0:20104"
      ADBE_HTTP_PORT: "8080"
      ADBE_SNAPSHOT_POLL_MS: "5000"
    ports:
      - "8080:8080/tcp"

  adbe-read-1:
    <<: *read_common
    hostname: adbe-read-1
    environment:
      ADBE_MODE: "standby"
      ADBE_ARCHIVE_CHANNEL: "aeron:udp?endpoint=adbe-node-1:20204"
      ADBE_HTTP_PORT: "8080"
      ADBE_SNAPSHOT_POLL_MS: "5000"
    ports:
      - "8081:8080/tcp"

  adbe-read-2:
    <<: *read_common
    hostname: adbe-read-2
    environment:
      ADBE_MODE: "standby"
      ADBE_ARCHIVE_CHANNEL: "aeron:udp?endpoint=adbe-node-2:20304"
      ADBE_HTTP_PORT: "8080"
      ADBE_SNAPSHOT_POLL_MS: "5000"
    ports:
      - "8082:8080/tcp"

networks:
  adbe-write:
    name: adbe_adbe
    external: true
