---
- name: Install jq for bench summary parsing
  ansible.builtin.apt:
    name: jq
    state: present
    update_cache: true

- name: Install bench script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../bench/run-bench.sh"
    dest: /usr/local/bin/ledgerd-bench
    owner: root
    group: root
    mode: "0755"

- name: Install batch bench script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../bench/run-batch.sh"
    dest: /usr/local/bin/ledgerd-batch
    owner: root
    group: root
    mode: "0755"

- name: Render bench environment
  ansible.builtin.template:
    src: bench.env.j2
    dest: /etc/ledgerd/bench.env
    owner: root
    group: root
    mode: "0644"

- name: Create bench results directory
  ansible.builtin.file:
    path: "{{ ledgerd_data_root }}/bench"
    state: directory
    owner: "{{ ledgerd_user }}"
    group: "{{ ledgerd_user }}"
    mode: "0755"

- name: Install bench exporter
  ansible.builtin.copy:
    src: bench_exporter.py
    dest: /usr/local/bin/ledgerd-bench-exporter.py
    owner: root
    group: root
    mode: "0755"

- name: Install bench exporter systemd unit
  ansible.builtin.template:
    src: ledgerd-bench-exporter.service.j2
    dest: /etc/systemd/system/ledgerd-bench-exporter.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start bench exporter
  ansible.builtin.systemd:
    name: ledgerd-bench-exporter
    daemon_reload: true
    enabled: true
    state: started
