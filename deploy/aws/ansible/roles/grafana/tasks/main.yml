---
- name: Create grafana user
  ansible.builtin.user:
    name: grafana
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create grafana directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /opt/grafana
    - /etc/grafana
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana
    - /var/log/grafana

- name: Check grafana binary
  ansible.builtin.stat:
    path: /opt/grafana/bin/grafana
  register: grafana_binary

- name: Download Grafana
  ansible.builtin.get_url:
    url: "https://dl.grafana.com/oss/release/grafana-{{ grafana_version }}.linux-amd64.tar.gz"
    dest: "/tmp/grafana-{{ grafana_version }}.tar.gz"
    mode: "0644"
    timeout: 600
  when: not grafana_binary.stat.exists

- name: Extract Grafana
  ansible.builtin.unarchive:
    src: "/tmp/grafana-{{ grafana_version }}.tar.gz"
    dest: /opt/grafana
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: grafana
    group: grafana
  when: not grafana_binary.stat.exists

- name: Render grafana config
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: grafana
    group: grafana
    mode: "0644"

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: "0644"

- name: Provision dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/provider.yml
    owner: grafana
    group: grafana
    mode: "0644"

- name: Remove stale dashboard definitions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/grafana/provisioning/dashboards/ledgerd.json
    - /etc/grafana/provisioning/dashboards/ledgerd-bench.json
    - /etc/grafana/provisioning/dashboards/ledgerd-batch-bench.json

- name: Provision LEDGERD cluster dashboard
  ansible.builtin.copy:
    src: ledgerd-cluster-dashboard.json
    dest: /etc/grafana/provisioning/dashboards/ledgerd-cluster.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Provision LEDGERD correctness dashboard
  ansible.builtin.copy:
    src: ledgerd-correctness-dashboard.json
    dest: /etc/grafana/provisioning/dashboards/ledgerd-correctness.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Provision LEDGERD read replica dashboard
  ansible.builtin.copy:
    src: ledgerd-read-dashboard.json
    dest: /etc/grafana/provisioning/dashboards/ledgerd-read.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Provision LEDGERD single-command bench dashboard
  ansible.builtin.copy:
    src: ledgerd-bench-single-dashboard.json
    dest: /etc/grafana/provisioning/dashboards/ledgerd-bench-single.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Provision LEDGERD batch bench dashboard
  ansible.builtin.copy:
    src: ledgerd-bench-batch-dashboard.json
    dest: /etc/grafana/provisioning/dashboards/ledgerd-bench-batch.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Install grafana systemd unit
  ansible.builtin.template:
    src: grafana.service.j2
    dest: /etc/systemd/system/grafana.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana
    daemon_reload: true
    enabled: true
    state: started
