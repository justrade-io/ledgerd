name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Build gate (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The CI gate mirrors the required local sequence. Ordering matters:
      # format -> lint -> compile (warnings are errors) -> tests -> benchmark smoke run.
      - name: Spotless (format check)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest

      - name: Compile (warnings as errors)
        run: ./gradlew --no-daemon compileJava

      - name: Unit and integration tests
        run: ./gradlew --no-daemon test integrationTest :adbe-tests:jacocoTestReport

      - name: JMH smoke run and latency budget check
        run: ./gradlew --no-daemon :adbe-core:jmhBudgetCheck -PquickBench

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: adbe-tests/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7
