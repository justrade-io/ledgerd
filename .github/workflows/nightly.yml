name: Nightly

# Heavier, timing-sensitive suites and the supply-chain scan that are kept out of
# the fast PR gate (ci.yml). Runs on a schedule and on demand.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy-tests:
    name: Cluster / fault / soak + JMH budget (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Multi-node cluster tests
        run: ./gradlew --no-daemon clusterTest

      - name: Fault-injection tests
        run: ./gradlew --no-daemon faultTest

      - name: Soak / chaos tests
        run: ./gradlew --no-daemon soakTest

      - name: JMH full run and latency budget check
        run: ./gradlew --no-daemon :adbe-core:jmhBudgetCheck

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            adbe-core/build/results/jmh/
          if-no-files-found: ignore
          retention-days: 14

  dependency-check:
    name: OWASP dependency-check (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Set the NVD_API_KEY repository secret to avoid NVD rate limiting.
      # Fails the job on a dependency with CVSS >= 7.0 (configured in build.gradle.kts).
      - name: Dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon dependencyCheckAggregate

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 14
