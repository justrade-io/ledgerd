# Local ADBE deployment: a 3-node Raft write cluster plus one read replica node.
#
#   docker compose up --build
#
# The three write services are Raft members on a shared bridge network, so
# containers reach each other by service name on any port (only ingress is
# published to the host for an external client). On a fresh start the members
# elect a leader and replicate committed commands.
#
# The read service (adbe-read-0) is a read replica node: it is NOT a cluster
# member, does not vote, and does not affect quorum. It connects to node 0's
# Aeron Archive, follows the consensus log (loading snapshots as they appear),
# and serves eventually-consistent reads over HTTP on host port 8080. It can be
# added, removed, or restarted independently without impacting write
# availability. See ADR 0006 and 0007.
#
# Write via an AdbeClient against any member ingress (localhost:20100). Read:
#   curl http://localhost:8080/balance/100
#   curl http://localhost:8080/supply
#
# The risk service (adbe-risk-0) is an Edge AI consumer (ADR 0012): like the read
# node it is NOT a Raft member and does not affect quorum. It follows the members'
# recorded domain event journal (ADR 0011), scores accounts for transaction
# velocity and money-flow graph centrality, and serves a live dashboard on host
# port 8090:
#   open http://localhost:8090/
#   curl http://localhost:8090/risk/scores
#   curl http://localhost:8090/risk/graph
#
# A remote client smoke test is available on demand (not started by default):
#   docker compose run --rm client
#
# To make the risk dashboard light up, drive a velocity spike and a money-flow hub
# against the cluster (not started by default), then watch http://localhost:8090:
#   docker compose run --rm risk-demo
#
# The write members run with the domain event journal enabled (ADR 0011): each
# records its own semantic event stream to its Archive. A verifier follows it:
#   docker compose run --rm event-verifier
#
# Note: Aeron uses UDP unicast between members plus ephemeral replication ports.
# Containers on this user-defined bridge network can reach each other on all
# ports without publishing them; only host->container access needs "ports".

name: adbe

# The Aeron member string is identical for every node; only the per-node id and
# advertised host differ. Ports follow ClusterConfig: base 20100, stride 100,
# offsets ingress/consensus/log/catchup/archive = +0/+1/+2/+3/+4.
x-cluster-members: &cluster_members >-
  0,adbe-node-0:20100,adbe-node-0:20101,adbe-node-0:20102,adbe-node-0:20103,adbe-node-0:20104|1,adbe-node-1:20200,adbe-node-1:20201,adbe-node-1:20202,adbe-node-1:20203,adbe-node-1:20204|2,adbe-node-2:20300,adbe-node-2:20301,adbe-node-2:20302,adbe-node-2:20303,adbe-node-2:20304

x-node-common: &node_common
  build:
    context: .
    dockerfile: Dockerfile
    target: node
  image: adbe-launcher:local
  networks:
    - adbe
  # Aeron benefits from a larger shared-memory segment than the 64MB default.
  shm_size: "512m"
  restart: unless-stopped

services:
  adbe-node-0:
    <<: *node_common
    hostname: adbe-node-0
    environment:
      ADBE_NODE_ID: "0"
      ADBE_HOST: adbe-node-0
      ADBE_CLUSTER_MEMBERS: *cluster_members
      ADBE_METRICS_PORT: "9100"
      ADBE_EVENT_JOURNAL: "true"
    ports:
      - "20100:20100/udp" # ingress for an external client
      - "9100:9100/tcp" # Prometheus metrics / healthz

  adbe-node-1:
    <<: *node_common
    hostname: adbe-node-1
    environment:
      ADBE_NODE_ID: "1"
      ADBE_HOST: adbe-node-1
      ADBE_CLUSTER_MEMBERS: *cluster_members
      ADBE_METRICS_PORT: "9100"
      ADBE_EVENT_JOURNAL: "true"
    ports:
      - "9101:9100/tcp"

  adbe-node-2:
    <<: *node_common
    hostname: adbe-node-2
    environment:
      ADBE_NODE_ID: "2"
      ADBE_HOST: adbe-node-2
      ADBE_CLUSTER_MEMBERS: *cluster_members
      ADBE_METRICS_PORT: "9100"
      ADBE_EVENT_JOURNAL: "true"
    ports:
      - "9102:9100/tcp"

  # Read replica node. Follows the cluster Archives (all three members) and
  # serves reads over HTTP, failing over across them if one member dies (ADR
  # 0008). Not a Raft member: no vote, no quorum impact, independent lifecycle.
  adbe-read-0:
    build:
      context: .
      dockerfile: Dockerfile
      target: read
    image: adbe-read:local
    hostname: adbe-read-0
    networks:
      - adbe
    shm_size: "512m"
    restart: unless-stopped
    depends_on:
      - adbe-node-0
      - adbe-node-1
      - adbe-node-2
    environment:
      ADBE_ARCHIVE_CHANNELS: "aeron:udp?endpoint=adbe-node-0:20104,aeron:udp?endpoint=adbe-node-1:20204,aeron:udp?endpoint=adbe-node-2:20304"
      ADBE_HTTP_PORT: "8080"
      ADBE_SNAPSHOT_POLL_MS: "5000"
      ADBE_LIVE_LOG: "true"
    ports:
      - "8080:8080/tcp" # HTTP query API

  # AI risk service (ADR 0012). Follows the cluster Archives' event journal (ADR
  # 0011), failing over across members (ADR 0008), and serves the live risk
  # dashboard over HTTP. Not a Raft member: no vote, no quorum impact, independent
  # lifecycle - like the read replica node.
  adbe-risk-0:
    build:
      context: .
      dockerfile: Dockerfile
      target: risk
    image: adbe-risk:local
    hostname: adbe-risk-0
    networks:
      - adbe
    shm_size: "512m"
    restart: unless-stopped
    depends_on:
      - adbe-node-0
      - adbe-node-1
      - adbe-node-2
    environment:
      ADBE_ARCHIVE_CHANNELS: "aeron:udp?endpoint=adbe-node-0:20104,aeron:udp?endpoint=adbe-node-1:20204,aeron:udp?endpoint=adbe-node-2:20304"
      ADBE_HTTP_PORT: "8090"
    ports:
      - "8090:8090/tcp" # HTTP risk dashboard + JSON API

  # Remote client smoke test. Not started by default; run on demand with:
  #   docker compose run --rm client
  # It connects to all three members over the internal network and submits a
  # credit and a transfer, exiting non-zero if the expected results do not arrive.
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: adbe-client-example:local
    profiles: ["client"]
    networks:
      - adbe
    shm_size: "512m"
    environment:
      ADBE_INGRESS_ENDPOINTS: "0=adbe-node-0:20100,1=adbe-node-1:20200,2=adbe-node-2:20300"
      ADBE_CLIENT_ID: "1"

  # Risk demo driver (ADR 0012). Not started by default; run on demand with:
  #   docker compose run --rm risk-demo
  # It reuses the remote-client image with ADBE_SCENARIO=risk to drive a
  # transaction-velocity spike and a money-flow hub against the cluster, so the
  # adbe-risk-0 dashboard (http://localhost:8090) visibly flags those accounts.
  # Set ADBE_SCENARIO_LOOP=true to keep it running for a live demo.
  risk-demo:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: adbe-client-example:local
    profiles: ["risk-demo"]
    networks:
      - adbe
    shm_size: "512m"
    depends_on:
      - adbe-risk-0
    environment:
      ADBE_INGRESS_ENDPOINTS: "0=adbe-node-0:20100,1=adbe-node-1:20200,2=adbe-node-2:20300"
      ADBE_CLIENT_ID: "2"
      ADBE_SCENARIO: "risk"
      ADBE_SCENARIO_LOOP: "false"

  # Domain event journal verifier (ADR 0011). Not started by default; run on
  # demand with:
  #   docker compose run --rm event-verifier
  # It follows the members' recorded event streams (failing over across them) and
  # exits non-zero unless it observes at least ADBE_EVENT_MIN recorded events.
  event-verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: event-verifier
    image: adbe-event-verifier:local
    profiles: ["verify"]
    networks:
      - adbe
    shm_size: "512m"
    environment:
      ADBE_ARCHIVE_CHANNELS: "aeron:udp?endpoint=adbe-node-0:20104,aeron:udp?endpoint=adbe-node-1:20204,aeron:udp?endpoint=adbe-node-2:20304"
      ADBE_EVENT_MIN: "2"
      ADBE_EVENT_TIMEOUT_MS: "30000"

networks:
  adbe:
    driver: bridge
